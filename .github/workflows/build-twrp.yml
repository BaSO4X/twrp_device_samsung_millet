name: TWRP手动编译-milllet

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt update -y
          sudo apt install -y openjdk-8-jdk build-essential bison flex lzop bc zip libssl-dev gnupg

      - name: 编译 TWRP
        run: |
          export USE_CCACHE=1
          export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
          source build/envsetup.sh
          lunch milllet-userdebug
          make recoveryimage -j$(nproc)

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: milllet_TWRP_7.1
          path: out/target/product/milllet/recovery.img
