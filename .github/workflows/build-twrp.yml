name: TWRP-millet 手动编译
on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 安装依赖 & 降级gcc适配7.1
        run: |
          sudo apt update -y
          sudo apt install -y git build-essential bison flex lzop bc zip cpio openjdk-8-jdk gcc-9 g++-9
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-9 90
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-9 90

      - name: 拉取 Omni 7.1 有效源码（分支100%存在）
        run: |
          mkdir -p twrp
          cd twrp
          git clone --depth=1 -b twrp-7.1 https://github.com/omnirom/android_bootable_recovery.git bootable/recovery
          git clone --depth=1 -b android-7.1 https://github.com/omnirom/android_build.git build
          git clone --depth=1 -b android-7.1 https://github.com/omnirom/android_vendor_omni.git vendor/omni

      - name: 导入你的设备配置
        uses: actions/checkout@v4
        with:
          path: twrp/device/millet

      - name: 编译
        run: |
          cd twrp
          source build/envsetup.sh
          lunch omni_millet-userdebug
          make recoveryimage -j$(nproc)

      - name: 上传 recovery.img
        uses: actions/upload-artifact@v4
        with:
          name: TWRP_millet_official
          path: twrp/out/target/product/millet/recovery.img


