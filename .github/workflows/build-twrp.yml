name: milllet-TWRP
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: 搭建完整TWRP7.1源码(自带envsetup)
        run: |
          sudo apt update && sudo apt install -y git repo openjdk-8-jdk build-essential
          mkdir twrp && cd twrp
          repo init -b twrp-7.1 --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git
          repo sync -j2

      - name: 把你的设备配置合并进去
        uses: actions/checkout@v4
        with:
          path: twrp/device/milllet

      - name: 编译(此时envsetup真实存在)
        run: |
          cd twrp
          source build/envsetup.sh
          lunch milllet-userdebug
          make recoveryimage -j$(nproc)

      - name: 上传镜像
        uses: actions/upload-artifact@v4
        with:
          path: twrp/out/target/product/milllet/recovery.img
